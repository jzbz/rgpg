<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <!--
    Widened from Lucide's 14 units to 16. Every other icon in this set inks
    20 of the 24-unit canvas; the stock plus inks 14, which left it visibly
    smaller than its neighbours and gave the button it sits in more dead
    space on the leading edge than the others had.
  -->
  <path d="M4 12h16" />
  <path d="M12 4v16" />
</svg>
